name: Build APK

on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Copy game into the app
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
      - name: Build APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Dami-Battle-Royale.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Dami-Battle-Royale-apk
          path: Dami-Battle-Royale.apk
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Dami Battle Royale APK (latest)
          body: Download Dami-Battle-Royale.apk and install it on your Android phone.
          files: Dami-Battle-Royale.apk
          make_latest: true
