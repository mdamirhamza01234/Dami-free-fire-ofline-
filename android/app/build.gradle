plugins { id 'com.android.application' }

android {
    namespace 'com.dami.battleroyale'
    compileSdk 34
    defaultConfig {
        applicationId 'com.dami.battleroyale'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            // debug key se sign hota hai taki seedha install ho sake
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
